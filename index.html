<!DOCTYPE html>
<html lang="en">
<head>

  <style>

      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;

      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      padding: 40px;
      border-radius: 20px;

      line-height: 1.6;

    button {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

<body>
  <div class="card">
    <h1>Hi, I'm Shankhadeep 👋</h1>
    <p>
